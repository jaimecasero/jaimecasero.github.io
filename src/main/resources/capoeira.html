<html>
<head>
    <script src="capoeira.js"></script>
    <link rel="stylesheet" href="capoeira.css">
    <link rel="manifest" href="capoeira_manifest.json">
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#FF4500">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Berimbot">
    <link rel="apple-touch-icon" href="img/berimbot_192.png">
    <meta property="og:title" content="Berimbot">
    <meta property="og:description" content="Learn Capoeira Music and try your own beats">
    <meta property="og:image"
          content="https://yt3.googleusercontent.com/ytc/AIdro_k8CmWRypNHJMdGnUpqwFc4GIu_P_rdCfYCG_R3pQpfDg0=s160-c-k-c0x00ffffff-no-rj">
    <link rel="icon"
          href="https://yt3.googleusercontent.com/ytc/AIdro_k8CmWRypNHJMdGnUpqwFc4GIu_P_rdCfYCG_R3pQpfDg0=s160-c-k-c0x00ffffff-no-rj"
          type="image/jpeg">
    <meta property="og:type" content="website">
</head>
<body>
<form id="settingsForm" class="berimbauForm">
    <BR>

    <table id="instrumentTable" class="instrument_table">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
    </table>

    <td>
        <input type="button" id="playButton" value="Play" onmousedown="playPause()" title="will play current Toque">
        <input type="button" id="shareButton" value="Share" onclick="sharePattern()" title="Copy a shareable link to this pattern">
        <!--
        <input type="button" id="subdivButton" value="16th" onclick="toggleSubdivision()" title="Toggle between 8th and 16th note grid">

        <span class="metro-control">
            <label for="metroSlider">Metro</label>
            <input type="range" id="metroSlider" min="0" max="100" value="0" step="10"
                   oninput="changeMetronomeVolume(this.value)" title="Metronome volume (0 = off)">
        </span>
        -->
    </td>
    <BR>
    <table>
        <tr>
            <td>
                <select id="beatSelect" onchange="changeBeat();">
                    <option selected="selected" value="0">SBGrandeAngola</option>
                    <option value="1">Angola</option>
                    <option value="2">SBPeqAngola</option>
                    <option value="3">SBGrandeReg</option>
                    <option value="4">Benguela</option>
                    <option value="5">Empty</option>
                </select></td>
            <td><select id="violaSelect" onchange="changeViola();">
                <option selected="selected" value="-1">base</option>
                <option value="0">variation 1</option>
                <option value="1">variation 2</option>
                <option value="2">variation 3</option>
                <option value="3">variation 4</option>
                <option value="4">variation 5</option>
                <option value="5">variation 6</option>
            </select></td>
            <td><select id="bpmSelect" title="Select music speed" onchange="changeBpm()">
                <option value="40">Largo (40)</option>
                <option value="60">Adagio (60)</option>
                <option value="76">Andante (76)</option>
                <option value="108">Moderato (108)</option>
                <option value="120">Allegro (120)</option>
                <option value="168">Vivace (168)</option>
                <option value="176">Presto (176)</option>
                <option value="200">Prestissimo (200)</option>
            </select></td>
        </tr>
    </table>

</form>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((reg) => console.log('[PWA] Service Worker registered, scope:', reg.scope))
                .catch((err) => console.log('[PWA] Service Worker registration failed:', err));
        });
    }
</script>
</body>
</html>
