<svg xmlns="http://www.w3.org/2000/svg" width="16" height="40" viewBox="0 0 16 40">
  <!-- Sixteenth note with stem down and two flags -->
  <!-- Filled notehead -->
  <ellipse cx="9" cy="5" rx="6" ry="5" transform="rotate(-20 9 5)" fill="currentColor"/>
  <!-- Stem going down from left side of notehead -->
  <rect x="3" y="5" width="1.5" height="32" fill="currentColor"/>
  <!-- First flag at bottom -->
  <path d="M4,37 C4,37 10,33 12,28" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Second flag slightly above -->
  <path d="M4,32 C4,32 10,28 12,23" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
