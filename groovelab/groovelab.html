<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NP7KCZGF61"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-NP7KCZGF61');
    </script>
    <title>GrooveLab</title>
    <script src="../drumtice/soundfont/drum-ogg.js"></script>
    <script src="groovelab.js"></script>
    <link rel="stylesheet" href="groovelab.css">
    <link rel="manifest" href="groovelab_manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="GrooveLab">
    <link rel="apple-touch-icon" href="./img/groovelab_192.svg">
    <meta property="og:title" content="GrooveLab">
    <meta property="og:description" content="Create, compose and share drum grooves">
    <meta property="og:type" content="website">
</head>
<body>
<form id="settingsForm">

    <table id="instrumentTable" class="instrument_table">
        <thead></thead>
        <tbody></tbody>
        <tfoot></tfoot>
    </table>

    <div class="toolbar">
        <button type="button" id="playButton" class="tool-btn" onmousedown="playPause()" title="Play / Pause groove" aria-label="Play">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="play-icon"><polygon points="5,3 19,12 5,21"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="pause-icon" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button type="button" id="metronomeButton" class="tool-btn tool-toggle" onclick="togglePlayAlong()" title="Metronome: count-in + click" aria-pressed="false" aria-label="Metronome">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="4.5,1.5 11.5,1.5 14,14.5 2,14.5"/><line x1="8" y1="13.5" x2="11.5" y2="4.5"/><circle cx="11" cy="6" r="1.5" fill="currentColor" stroke="none"/></svg>
        </button>
        <button type="button" id="lockButton" class="tool-btn tool-toggle" onclick="toggleGridLock()" title="Lock / Unlock grid editing" aria-pressed="false" aria-label="Lock">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="8" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>
        </button>
        <button type="button" id="clearButton" class="tool-btn" onclick="clearMeasure()" title="Clear current bar" aria-label="Clear">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/></svg>
        </button>
        <button type="button" id="undoButton" class="tool-btn" onclick="undo()" title="Undo last change" aria-label="Undo">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,4 1,10 7,10"/><path d="M3.51,15a9,9,0 1,0,.49-4.1"/></svg>
        </button>
        <button type="button" id="shareButton" class="tool-btn" onclick="sharePattern()" title="Copy shareable link to this groove" aria-label="Share">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button type="button" id="midiButton" class="tool-btn" onclick="exportMidi()" title="Export groove as MIDI file" aria-label="MIDI export">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
    </div>


    <div class="controls-row">
        <select id="timeSigSelect" title="Time Signature" onchange="changeTimeSig()">
            <option value="0">2/4</option>
            <option value="1">3/4</option>
            <option value="2" selected>4/4</option>
            <option value="3">5/4</option>
            <option value="4">7/4</option>
            <option value="5">6/8</option>
            <option value="6">12/8</option>
        </select>
        <select id="measureSelect" title="Measure" onchange="changeMeasure()">
            <option value="0">Bar 1</option>
            <option value="1">Bar 2</option>
            <option value="2">Bar 3</option>
            <option value="3">Bar 4</option>
        </select>
        <select id="bpmSelect" title="Tempo" onchange="changeBpm()" style="flex:1">
            <option value="60">Largo (60)</option>
            <option value="75">Slow (75)</option>
            <option value="90">Moderate (90)</option>
            <option value="96">Funk (96)</option>
            <option value="110">Bossa (110)</option>
            <option value="120" selected>Allegro (120)</option>
            <option value="130">Upbeat (130)</option>
            <option value="140">Jazz (140)</option>
            <option value="160">Fast (160)</option>
            <option value="180">Very Fast (180)</option>
            <option value="200">Prestissimo (200)</option>
        </select>
        <select id="beatSelect" onchange="changeBeat()" style="flex:1">
            <option value="0">Empty</option>
            <option value="1" selected>Rock</option>
            <option value="2">Funk</option>
            <option value="3">Hip-Hop</option>
            <option value="4">Jazz</option>
            <option value="5">Reggae</option>
            <option value="6">Bossa Nova</option>
            <option value="7">8th Sync</option>
            <option value="8">Disco</option>
            <option value="9">Train</option>
            <option value="10">Half Shuffle</option>
            <option value="11">Ride Bell</option>
        </select>
    </div>

</form>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('[PWA] SW registered, scope:', reg.scope))
                .catch(err => console.log('[PWA] SW registration failed:', err));
        });
    }
</script>
</body>
</html>
