<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="gp" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9d5cff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="gc" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#0a0a14"/>
  <!-- Border -->
  <rect x="2" y="2" width="188" height="188" rx="30" fill="none" stroke="#2a2748" stroke-width="2"/>

  <!-- GL monogram -->
  <text x="96" y="60"
        text-anchor="middle"
        font-family="monospace, 'Courier New', monospace"
        font-size="44" font-weight="bold"
        fill="#7c3aed" letter-spacing="8">GL</text>

  <!-- Separator -->
  <line x1="18" y1="72" x2="174" y2="72" stroke="#2a2748" stroke-width="1.5"/>

  <!-- Beat sequencer grid: 4 cols × 3 rows                      -->
  <!-- Cols x: 18, 60, 102, 144  |  cell w=30  |  gap=12        -->
  <!-- Rows y: 82, 116, 150      |  cell h=22  |  gap=12        -->
  <!-- Row 0: HiHat  – all 4 beats, purple                      -->
  <!-- Row 1: Snare  – beats 2,4, cyan                          -->
  <!-- Row 2: Kick   – beats 1,3, cyan                          -->

  <!-- Row 0: HiHat -->
  <rect x="18"  y="82" width="30" height="22" rx="5" fill="url(#gp)"/>
  <rect x="60"  y="82" width="30" height="22" rx="5" fill="url(#gp)"/>
  <rect x="102" y="82" width="30" height="22" rx="5" fill="url(#gp)"/>
  <rect x="144" y="82" width="30" height="22" rx="5" fill="url(#gp)"/>

  <!-- Row 1: Snare (off, on, off, on) -->
  <rect x="18"  y="116" width="30" height="22" rx="5" fill="#1a1730" stroke="#2a2748" stroke-width="1.5"/>
  <rect x="60"  y="116" width="30" height="22" rx="5" fill="url(#gc)"/>
  <rect x="102" y="116" width="30" height="22" rx="5" fill="#1a1730" stroke="#2a2748" stroke-width="1.5"/>
  <rect x="144" y="116" width="30" height="22" rx="5" fill="url(#gc)"/>

  <!-- Row 2: Kick (on, off, on, off) -->
  <rect x="18"  y="150" width="30" height="22" rx="5" fill="url(#gc)"/>
  <rect x="60"  y="150" width="30" height="22" rx="5" fill="#1a1730" stroke="#2a2748" stroke-width="1.5"/>
  <rect x="102" y="150" width="30" height="22" rx="5" fill="url(#gc)"/>
  <rect x="144" y="150" width="30" height="22" rx="5" fill="#1a1730" stroke="#2a2748" stroke-width="1.5"/>
</svg>
