<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootKick Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>FootKick Lab</h1>

<div class="row">
    <button id="connectBtn">Connect Sensor</button>
    <span id="status">Disconnected</span>
    <span id="battery" class="battery" title="Battery">
        <svg id="batteryIcon" viewBox="0 0 28 14" width="36" height="18">
            <rect x="0.5" y="0.5" width="24" height="13" rx="2" ry="2"
                  fill="none" stroke="currentColor" stroke-width="1.2"/>
            <rect x="24.5" y="4" width="3" height="6" rx="1"
                  fill="currentColor"/>
            <rect id="batteryFill" x="2" y="2" width="0" height="10" rx="1"/>
        </svg>
        <span id="batteryPct"></span>
    </span>
</div>

<!-- Kick indicator -->
<div id="kickIndicator">
    <span>KICK</span>
    <span id="kickVel"></span>
</div>

<!-- Output -->
<section>
    <h2>Output</h2>
    <div class="field">
        <label>Mode</label>
        <div class="toggle-group">
            <button id="modeAudio" class="toggle active">Audio</button>
            <button id="modeMidi"  class="toggle">MIDI</button>
        </div>
    </div>

    <div id="audioPanel">
        <div class="field">
            <label>Volume</label>
            <input id="audioVol" type="range" min="0" max="1" step="0.05" value="0.8">
        </div>
    </div>

    <div id="midiPanel" hidden>
        <div class="field">
            <label>Device</label>
            <select id="midiOutputs"></select>
            <span id="midiStatus"></span>
        </div>
        <div class="field">
            <label>Note</label>
            <input id="note" type="number" min="0" max="127" value="36">
        </div>
    </div>

    <button id="testBtn">Test</button>
</section>

<!-- Detection settings -->
<section>
    <h2>Detection</h2>
    <div class="field">
        <label>Rest position</label>
        <button id="calibrateBtn">Calibrate</button>
        <span id="calibrateVal" class="dim">uncalibrated</span>
    </div>
    <div class="field">
        <label>Tap axis</label>
        <select id="tapAxis" class="kick-setting">
            <option value="mag" selected>Magnitude (all axes)</option>
            <option value="x">X</option>
            <option value="y">Y</option>
            <option value="z">Z</option>
        </select>
    </div>
    <div class="field">
        <label>Threshold <small>(g)</small></label>
        <input id="threshold" class="kick-setting" type="number" min="0.1" max="10" step="0.05" value="0.8">
    </div>
    <div class="field">
        <label>Reset <small>(g)</small></label>
        <input id="resetThreshold" class="kick-setting" type="number" min="0.05" max="5" step="0.05" value="0.25">
    </div>
    <div class="field">
        <label>Min hold <small>(ms)</small></label>
        <input id="minCooldown" class="kick-setting" type="number" min="20" max="500" step="10" value="80">
    </div>
    <div class="field">
        <label>Min vel</label>
        <input id="minVel" class="kick-setting" type="number" min="1" max="127" value="40">
    </div>
    <div class="field">
        <label>Max vel</label>
        <input id="maxVel" class="kick-setting" type="number" min="1" max="127" value="127">
    </div>
</section>

<!-- IMU readout -->
<section>
    <h2>IMU</h2>
    <table>
        <tbody>
            <tr><td>Accel X</td><td id="ax" class="value"></td></tr>
            <tr><td>Accel Y</td><td id="ay" class="value"></td></tr>
            <tr><td>Accel Z</td><td id="az" class="value"></td></tr>
            <tr><td>Gyro X</td>  <td id="wx" class="value"></td></tr>
            <tr><td>Gyro Y</td>  <td id="wy" class="value"></td></tr>
            <tr><td>Gyro Z</td>  <td id="wz" class="value"></td></tr>
            <tr><td>Tap axis g</td><td id="dyn" class="value"></td></tr>
        </tbody>
    </table>
</section>

<script src="app.js"></script>
</body>
</html>
